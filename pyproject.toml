[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cycles"
version = "0.1.0"
description = "High-performance deep learning classifier and cyclicity analyzer for rodent vaginal cytology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pyside6>=6.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "ultralytics>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[project.scripts]
cycles = "cycles.cli.main:main"
cycles-gui = "cycles.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["cycles"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501", "N812", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
